<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0d1117" stroke="url(#ringGrad)" stroke-width="2"/>
  
  <!-- DNA double helix strands -->
  <path d="M22 8 C22 8, 42 18, 42 24 C42 30, 22 34, 22 40 C22 46, 42 50, 42 56" 
        stroke="url(#strand1)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M42 8 C42 8, 22 18, 22 24 C22 30, 42 34, 42 40 C42 46, 22 50, 22 56" 
        stroke="url(#strand2)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Base pair rungs -->
  <line x1="25" y1="14" x2="39" y2="14" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="36" y1="21" x2="28" y2="21" stroke="#ffcc00" stroke-width="1.5" opacity="0.7"/>
  <line x1="24" y1="28" x2="40" y2="28" stroke="#33d17a" stroke-width="1.5" opacity="0.7"/>
  <line x1="30" y1="35" x2="34" y2="35" stroke="#e040a0" stroke-width="1.5" opacity="0.7"/>
  <line x1="40" y1="42" x2="24" y2="42" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="28" y1="49" x2="36" y2="49" stroke="#ffcc00" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Base pair dots -->
  <circle cx="25" cy="14" r="2.5" fill="#00d4ff"/>
  <circle cx="39" cy="14" r="2.5" fill="#ffcc00"/>
  <circle cx="36" cy="21" r="2.5" fill="#33d17a"/>
  <circle cx="28" cy="21" r="2.5" fill="#e040a0"/>
  <circle cx="24" cy="28" r="2.5" fill="#ffcc00"/>
  <circle cx="40" cy="28" r="2.5" fill="#00d4ff"/>
  <circle cx="30" cy="35" r="2.5" fill="#e040a0"/>
  <circle cx="34" cy="35" r="2.5" fill="#33d17a"/>
  <circle cx="40" cy="42" r="2.5" fill="#00d4ff"/>
  <circle cx="24" cy="42" r="2.5" fill="#ffcc00"/>
  <circle cx="28" cy="49" r="2.5" fill="#33d17a"/>
  <circle cx="36" cy="49" r="2.5" fill="#e040a0"/>
  
  <!-- Glow particles -->
  <circle cx="14" cy="20" r="1" fill="#00d4ff" opacity="0.5"/>
  <circle cx="50" cy="32" r="1.2" fill="#e040a0" opacity="0.4"/>
  <circle cx="16" cy="48" r="0.8" fill="#33d17a" opacity="0.5"/>
  <circle cx="48" cy="14" r="1" fill="#ffcc00" opacity="0.4"/>
  <circle cx="50" cy="50" r="0.9" fill="#00d4ff" opacity="0.3"/>
  
  <defs>
    <linearGradient id="strand1" x1="22" y1="8" x2="42" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="strand2" x1="42" y1="8" x2="22" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e040a0"/>
      <stop offset="50%" stop-color="#33d17a"/>
      <stop offset="100%" stop-color="#e040a0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e040a0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
</svg>